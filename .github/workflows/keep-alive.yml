name: Keep Supabase and Render Alive

on:
  schedule:
    # Roda a cada 2 dias às 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Altere a URL abaixo para a URL real do seu backend no Render
          # Exemplo: curl -sSf https://seu-backend.onrender.com/health
          curl -sSf ${{ secrets.BACKEND_URL }}/health || echo "Ping falhou, mas a action continuará. Certifique-se de definir a secret BACKEND_URL no GitHub."
